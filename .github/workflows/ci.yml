name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
permissions:
  contents: read
jobs:
  verify:
    name: Foundation checks
    runs-on: ubuntu-24.04
    env:
      PLAYWRIGHT_WS_ENDPOINT: ws://127.0.0.1:3002/
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: joint
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: joint
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U joint -d joint"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm build
      - run: cp .env.example .env
      - run: pnpm db:migrate
      - run: pnpm db:runtime
      - run: pnpm db:seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm imports:setup
      - run: pnpm auth:setup
      - name: Start local Auth and synthetic inbox
        run: >-
          docker compose --env-file .env.auth --profile auth
          up -d --wait auth-gateway auth mailpit auth-db
      - run: pnpm test:integration
      - name: Start pinned browser server
        run: |
          docker run -d --name joint-playwright --init --ipc=host --network=host \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work,readonly" \
            --workdir /work mcr.microsoft.com/playwright:v1.58.2-noble \
            node /work/node_modules/@playwright/test/cli.js run-server \
            --host 127.0.0.1 --port 3002
          curl --fail --silent --show-error --retry 30 --retry-connrefused \
            --retry-delay 1 --max-time 2 http://127.0.0.1:3002/json
      - run: pnpm test:e2e
      - name: Stop browser server
        if: always()
        run: |
          if docker container inspect joint-playwright >/dev/null 2>&1; then
            docker rm -f joint-playwright
          fi
