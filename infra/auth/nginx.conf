events {}
http {
  access_log off;
  server {
    listen 8080;
    client_max_body_size 32k;
    location /auth/v1/ {
      proxy_pass http://auth:9999/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto http;
      proxy_read_timeout 10s;
    }
    location /templates/ {
      alias /templates/;
      default_type text/html;
    }
    location = /health { return 200 "ok"; }
  }
}
