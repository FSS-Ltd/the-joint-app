services:
  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: joint
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: joint
    volumes:
      - joint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U joint -d joint"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth-db:
    profiles: [auth]
    image: postgres:17.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-auth-development-only
      POSTGRES_DB: auth
    volumes:
      - joint-auth-postgres:/var/lib/postgresql/data
      - ./infra/auth/init.sql:/docker-entrypoint-initdb.d/10-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U supabase_auth_admin -d auth"]
      interval: 2s
      timeout: 3s
      retries: 30
  auth:
    profiles: [auth]
    image: supabase/gotrue:v2.197.0
    depends_on:
      auth-db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:${AUTH_HTTP_PORT:-15421}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:local-auth-development-only@auth-db:5432/auth
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://127.0.0.1:3000
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:3000
      GOTRUE_JWT_ISSUER: http://127.0.0.1:${AUTH_HTTP_PORT:-15421}/auth/v1
      GOTRUE_JWT_KEYS: ${AUTH_JWT_KEYS:-[]}
      GOTRUE_JWT_SECRET: ${AUTH_LOCAL_JWT_SECRET:-}
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: 900
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_OTP_EXP: 600
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: http://auth-gateway:8080/templates/confirmation.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://auth-gateway:8080/templates/recovery.html
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: local@joint.test
      GOTRUE_SMTP_SENDER_NAME: The Joint App (local)
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      # Synthetic test inbox only; production abuse controls require a separate review.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_PHONE_ENROLL_ENABLED: "false"
      GOTRUE_MFA_PHONE_VERIFY_ENABLED: "false"
      GOTRUE_LOG_LEVEL: error
      GOTRUE_SECURITY_REFRESH_TOKEN_ROTATION_ENABLED: "true"
      GOTRUE_SECURITY_REFRESH_TOKEN_REUSE_INTERVAL: 10
      GOTRUE_PASSWORD_MIN_LENGTH: 12
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://localhost:9999/health]
      interval: 2s
      timeout: 3s
      retries: 30
  auth-gateway:
    profiles: [auth]
    image: nginx:1.30.6-alpine-slim
    depends_on:
      auth:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AUTH_HTTP_PORT:-15421}:8080"
    volumes:
      - ./infra/auth/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/auth/templates:/templates:ro
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/health]
      interval: 2s
      timeout: 3s
      retries: 30
  mailpit:
    profiles: [auth]
    image: axllent/mailpit:v1.32.0
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-15424}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_DISABLE_VERSION_CHECK: "true"

volumes:
  joint-postgres:

  joint-auth-postgres:
