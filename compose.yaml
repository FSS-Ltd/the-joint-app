services:
  postgres:
    image: postgres:17.6
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: joint
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: joint
    volumes:
      - joint-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U joint -d joint"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  joint-postgres:
